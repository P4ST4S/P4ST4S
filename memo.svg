<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img" aria-label="A typed note: about Antoine" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="4" seed="4" result="n"/>
      <feColorMatrix in="n" values="0 0 0 0 .42  0 0 0 0 .30  0 0 0 0 .18  0 0 0 .9 -.28" result="stain"/>
      <feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="1" seed="9" result="f"/>
      <feColorMatrix in="f" values="0 0 0 0 .3  0 0 0 0 .27  0 0 0 0 .22  0 0 0 0 .10" result="fiber"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="stain"/><feMergeNode in="fiber"/></feMerge>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="ink"><feTurbulence baseFrequency=".9" numOctaves="1" seed="3"/><feDisplacementMap in="SourceGraphic" scale="1.3"/></filter>
    <radialGradient id="ring" cx=".5" cy=".5" r=".5">
      <stop offset=".72" stop-color="#6b2a14" stop-opacity="0"/>
      <stop offset=".86" stop-color="#6b2a14" stop-opacity=".45"/>
      <stop offset="1" stop-color="#6b2a14" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="rotate(-1.4 430 235)">
    <rect x="46" y="38" width="768" height="404" fill="#000" opacity=".35" filter="url(#shadow)" transform="translate(6 10)"/>
    <rect x="40" y="30" width="780" height="410" fill="#cdc4b0" filter="url(#paper)"/>
    <line x1="40" y1="232" x2="820" y2="236" stroke="#9c927c" stroke-width="1" opacity=".55"/>
    <circle cx="742" cy="378" r="56" fill="url(#ring)"/>

    <g font-family="'Courier New', Courier, 'DejaVu Sans Mono', monospace" font-size="17.5" fill="#2b2620" filter="url(#ink)">
      <text x="86" y="88" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="22" fill="#4a1410">a note left on a desk in Paris</text>
      <text x="86" y="138">My name is Antoine. Most people call me Pastas.</text>
      <text x="86" y="168">Full stack engineer at Datakeen: identity checks,</text>
      <text x="86" y="198">passports read over NFC, papers that must not lie.</text>
      <text x="86" y="228">I keep the Flutter NFC SDK alive, Kotlin and Swift</text>
      <text x="86" y="258">down in the walls. NestJS, React, too much Go.</text>
      <text x="86" y="288">MSc at EPITECH, class of 2027.</text>
      <text x="86" y="318">At night I build MCP tooling and models that run</text>
      <text x="86" y="348">on my own GPU, where nothing phones home.</text>
      <text x="86" y="398" fill="#5a3a2a">If you found this, the build is probably still red.</text>
    </g>
  </g>
</svg>
