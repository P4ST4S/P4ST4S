name: Metrics
on:
  schedule: [{ cron: "0 * * * *" }]
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: .github/output/metrics.classic.svg
          user: P4ST4S
          token: ${{ secrets.METRICS_TOKEN }}
          template: classic
          # Base metrics
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          # Repositories fetching: échantillon large + forks inclus pour que
          # Stargazers / Forkers / Watchers / Releases / Packages ne tombent plus à 0
          repositories: 200
          repositories_batch: 100
          repositories_affiliations: owner, collaborator, organization_member
          repositories_forks: yes
          repositories_skipped: ""
          # Popular plugins
          plugin_isocalendar: yes
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_topics: yes
          plugin_followup: yes
          plugin_followup_indepth: yes
