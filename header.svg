<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Antoine Rospars — fullstack · no sleep · all gas" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3835"/>
      <stop offset=".55" stop-color="#2a2826"/>
      <stop offset="1" stop-color="#1d1b19"/>
    </linearGradient>
    <radialGradient id="rust" cx=".5" cy=".45" r=".75">
      <stop offset=".45" stop-color="#3b1a10" stop-opacity="0"/>
      <stop offset="1" stop-color="#3b1a10" stop-opacity=".75"/>
    </radialGradient>
    <filter id="fogA" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.0035 0.011" numOctaves="4" seed="7"/>
      <feColorMatrix values="0 0 0 0 .80  0 0 0 0 .79  0 0 0 0 .76  0 0 0 1.5 -.55"/>
    </filter>
    <filter id="fogB" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.02" numOctaves="3" seed="21"/>
      <feColorMatrix values="0 0 0 0 .84  0 0 0 0 .83  0 0 0 0 .80  0 0 0 1.7 -.6"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="1" seed="1">
        <animate attributeName="seed" values="1;5;9;13;17" dur=".5s" calcMode="discrete" repeatCount="indefinite"/>
      </feTurbulence>
      <feColorMatrix values="0 0 0 0 .9  0 0 0 0 .9  0 0 0 0 .88  0 0 0 0 .07"/>
    </filter>
    <filter id="emerge" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="9">
        <animate attributeName="stdDeviation" values="9;9;0.5" keyTimes="0;.15;1" dur="4.5s" fill="freeze"/>
      </feGaussianBlur>
    </filter>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfccc5" stop-opacity="0"/>
      <stop offset="1" stop-color="#cfccc5" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="vm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".45" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1b19" stop-opacity="0"/>
      <stop offset=".4" stop-color="#1d1b19"/>
    </linearGradient>
    <mask id="nearMask"><rect y="150" width="1200" height="240" fill="url(#vm)"/></mask>
  </defs>

  <rect width="1200" height="380" fill="url(#sky)"/>

  <!-- far fog -->
  <g opacity=".55">
    <rect x="-120" y="0" width="1440" height="380" filter="url(#fogA)">
      <animateTransform attributeName="transform" type="translate" values="-60 0;60 0;-60 0" dur="48s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- distant town: rooftops, poles, sagging wires -->
  <g fill="#34312e" opacity=".9">
    <path d="M0 300 L0 262 L60 262 L60 248 L118 248 L118 270 L170 270 L170 236 L196 222 L222 236 L222 276 L300 276 L300 258 L360 258 L360 284 L430 284 L430 300 Z"/>
    <path d="M760 300 L760 280 L820 280 L820 250 L880 250 L880 266 L935 266 L935 230 L962 214 L989 230 L989 270 L1060 270 L1060 254 L1130 254 L1130 276 L1200 276 L1200 300 Z"/>
  </g>
  <g stroke="#2c2927" fill="none" stroke-width="5">
    <path d="M250 300 V150 M228 168 H272 M234 182 H266"/>
    <path d="M560 300 V172 M541 188 H579"/>
    <path d="M1010 300 V140 M986 160 H1034 M992 175 H1028"/>
  </g>
  <g stroke="#2c2927" fill="none" stroke-width="1.4" opacity=".9">
    <path d="M-20 196 Q115 230 228 168"/>
    <path d="M272 168 Q406 214 541 188"/>
    <path d="M579 188 Q782 222 986 160"/>
    <path d="M1034 160 Q1120 190 1220 176"/>
    <path d="M266 182 Q410 226 541 196"/>
    <path d="M579 196 Q786 236 992 175"/>
  </g>
  <rect y="270" width="1200" height="110" fill="url(#ground)"/>

  <!-- name rising out of the fog -->
  <g filter="url(#emerge)">
    <text x="600" y="196" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-size="82" letter-spacing="7" fill="#d9d5cd">Antoine Rospars</text>
  </g>
  <text x="600" y="246" text-anchor="middle" font-family="'Courier New', Courier, 'DejaVu Sans Mono', monospace" font-size="19" letter-spacing="3" fill="#a39d93" opacity="0">P4ST4S · fullstack · no sleep · all gas
    <animate attributeName="opacity" values="0;0;.95" keyTimes="0;.6;1" dur="5.5s" fill="freeze"/>
  </text>

  <!-- near fog, drifting the other way -->
  <rect y="180" width="1200" height="200" fill="url(#fade)"/>
  <g opacity=".7" mask="url(#nearMask)">
    <rect x="-120" y="150" width="1440" height="240" filter="url(#fogB)">
      <animateTransform attributeName="transform" type="translate" values="50 0;-50 0;50 0" dur="36s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect width="1200" height="380" fill="url(#rust)"/>
  <rect width="1200" height="380" filter="url(#grain)"/>
</svg>
