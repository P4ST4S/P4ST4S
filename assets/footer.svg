<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="the fog clears when the build passes">
<defs>
  <style>
    @font-face{font-family:"fi";src:url(data:font/woff2;base64,) format("woff2")}
  </style>
  <filter id="f" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".0045 .02" numOctaves="4" seed="12"/>
    <feColorMatrix values="0 0 0 0 0.62  0 0 0 0 0.62  0 0 0 0 0.6  0 0 0 1.5 -.58"/>
  </filter>
  <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".85"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="h" x1="0" x2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".2" stop-color="#fff"/>
    <stop offset=".8" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <mask id="mv"><rect width="1200" height="220" fill="url(#g)"/></mask>
  <mask id="mh"><rect width="1200" height="220" fill="url(#h)"/></mask>
</defs>
<g mask="url(#mh)"><g mask="url(#mv)" opacity=".8">
  <rect x="-160" width="1520" height="220" filter="url(#f)">
    <animateTransform attributeName="transform" type="translate" values="-70 0;70 0;-70 0" dur="52s" repeatCount="indefinite"/>
  </rect>
</g></g>
<text x="600" y="112" text-anchor="middle" font-family="fi,Georgia,'Times New Roman',serif" font-style="italic" font-size="24" letter-spacing="1.5" fill="#8a847a">the fog clears when the build passes
  <animate attributeName="opacity" values="1;.55;1" dur="8s" repeatCount="indefinite"/>
</text>
<text x="600" y="146" text-anchor="middle" font-family="fi,Georgia,serif" font-style="italic" font-size="15" letter-spacing="3" fill="#5f5a52">ending: leave</text>
</svg>
