<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-label="the fog clears when the build passes" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="f" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.005 0.018" numOctaves="4" seed="12"/>
      <feColorMatrix values="0 0 0 0 .62  0 0 0 0 .61  0 0 0 0 .58  0 0 0 1.6 -.55"/>
    </filter>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".55" stop-color="#fff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="m"><rect width="1200" height="200" fill="url(#g)"/></mask>
  </defs>
  <g mask="url(#m)" opacity=".85">
    <rect x="-120" width="1440" height="200" filter="url(#f)">
      <animateTransform attributeName="transform" type="translate" values="-50 0;50 0;-50 0" dur="40s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="600" y="92" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="22" letter-spacing="2" fill="#7d776e">the fog clears when the build passes
    <animate attributeName="opacity" values=".9;.55;.9" dur="7s" repeatCount="indefinite"/>
  </text>
</svg>
