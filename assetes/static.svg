<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 36" width="1200" height="36" role="img" aria-label="divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="s">
      <feTurbulence type="fractalNoise" baseFrequency=".9 .4" numOctaves="2" seed="2">
        <animate attributeName="seed" values="2;8;3;11;6" dur=".4s" calcMode="discrete" repeatCount="indefinite"/>
      </feTurbulence>
      <feColorMatrix values="0 0 0 0 .55  0 0 0 0 .53  0 0 0 0 .50  1.2 0 0 0 -.35"/>
    </filter>
    <linearGradient id="edge" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".25" stop-color="#fff"/>
      <stop offset=".75" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="m"><rect width="1200" height="36" fill="url(#edge)"/></mask>
  </defs>
  <g mask="url(#m)">
    <rect y="10" width="1200" height="16" filter="url(#s)">
      <animate attributeName="opacity" values=".9;.4;.8;.2;.9" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <rect y="17.5" width="1200" height="1" fill="#7a3b1e" opacity=".8"/>
  </g>
</svg>
